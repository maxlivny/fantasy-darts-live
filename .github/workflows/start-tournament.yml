name: Start new tournament

on:
  workflow_dispatch:
    inputs:
      rating_participants:
        description: "Confirmed rating participant names, one per line"
        required: false
        default: ""
      rating_slots:
        description: "Number of rating places"
        required: false
        default: "0"
      csv_path:
        description: "CSV path in repo (example: incoming/tournament.csv)"
        required: true
        default: "incoming/tournament.csv"
      tournament_name:
        description: "Tournament name (leave blank to read it from CSV)"
        required: false
        default: ""
      source_url:
        description: "Wikipedia or DartConnect URL"
        required: true
      source_type:
        description: "Results source"
        required: true
        type: choice
        options:
          - wikipedia
          - dartconnect
        default: wikipedia
      budget:
        description: "Budget (leave blank to read it from CSV)"
        required: false
        default: ""
      start_stage:
        description: "Start stage"
        required: true
        default: "1/32"
      stage_scores:
        description: "Scores, comma separated"
        required: true
        default: "0,1,3,5,8,12,16"
      winning_legs:
        description: "Winning legs by round, comma separated"
        required: true
        default: "6,6,6,6,7,8"
      seeded_players:
        description: "Seeded players separated by |"
        required: false
        default: ""
      seeded_start_round:
        description: "Round where seeds enter"
        required: true
        default: "2"
      first_round_matches:
        description: "Number of first-round matches"
        required: true
        default: "16"

permissions:
  contents: write
  actions: write

concurrency:
  group: fantasy-live
  cancel-in-progress: false

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build new tournament
        shell: bash
        env:
          RATING_PARTICIPANTS: ${{ inputs.rating_participants }}
          RATING_SLOTS: ${{ inputs.rating_slots }}
          CSV_PATH: ${{ inputs.csv_path }}
          NAME: ${{ inputs.tournament_name }}
          SOURCE_URL: ${{ inputs.source_url }}
          SOURCE_TYPE: ${{ inputs.source_type }}
          BUDGET: ${{ inputs.budget }}
          START_STAGE: ${{ inputs.start_stage }}
          STAGE_SCORES: ${{ inputs.stage_scores }}
          WINNING_LEGS: ${{ inputs.winning_legs }}
          SEEDED: ${{ inputs.seeded_players }}
          SEEDED_START_ROUND: ${{ inputs.seeded_start_round }}
          FIRST_ROUND_MATCHES: ${{ inputs.first_round_matches }}
        run: |
          args=(
            --csv "$CSV_PATH"
            --rating-participants "$RATING_PARTICIPANTS"
            --rating-slots "$RATING_SLOTS"
            --url "$SOURCE_URL"
            --source "$SOURCE_TYPE"
            --start-stage "$START_STAGE"
            --stage-scores "$STAGE_SCORES"
            --winning-legs "$WINNING_LEGS"
            --seeded "$SEEDED"
            --seeded-start-round "$SEEDED_START_ROUND"
            --first-round-matches "$FIRST_ROUND_MATCHES"
          )
          if [ -n "$NAME" ]; then args+=(--name "$NAME"); fi
          if [ -n "$BUDGET" ]; then args+=(--budget "$BUDGET"); fi
          echo "Checking tournament script..."
          python -m py_compile scripts/start_tournament.py
          python scripts/start_tournament.py "${args[@]}"
          echo "Checking generated tournament files..."
          python - <<'PY_CHECK'
          import json, os, sys
          from pathlib import Path
          name = os.environ["NAME"].strip()
          project = json.loads(Path("data/project.json").read_text(encoding="utf-8"))
          config = json.loads(Path("data/config.json").read_text(encoding="utf-8"))
          site = json.loads(Path("site/data.json").read_text(encoding="utf-8"))
          actual = project.get("settings", {}).get("tournament_name", "")
          print(f"Project tournament: {actual}")
          print(f"Config title: {config.get('site_title')}")
          print(f"Site tournament: {site.get('tournament')}")
