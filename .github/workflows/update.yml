name: Update fantasy standings

on:
  workflow_dispatch:
  schedule:
  - cron: "2-59/5 * * * *"
  push:
    paths:
      - "data/**"
      - "scripts/**"
      - "site/**"
      - "requirements.txt"
      - ".github/workflows/update.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fantasy-live
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Detect results source
        id: results_source
        run: |
          python - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          config = json.loads(Path("data/config.json").read_text(encoding="utf-8"))
          source = str(config.get("result_source", "wikipedia")).strip().casefold()
          if source not in {"wikipedia", "dartconnect"}:
              raise ValueError(f"Unknown results source: {source}")
          print(f"Results source: {source}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"source={source}\n")
          PYTHON

      - name: Install Playwright Chromium
        if: steps.results_source.outputs.source == 'dartconnect'
        run: python -m playwright install --with-deps chromium

      - name: Update tournament results
        run: python scripts/update_results.py

      - name: Commit refreshed data
        run: |
          git config user.name "fantasy-live-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data.json
          git diff --cached --quiet || git commit -m "Auto-update fantasy standings"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Wait for artifact availability
        run: sleep 30

      - name: Deploy GitHub Pages
        continue-on-error: true
        uses: actions/deploy-pages@v4
        id: deployment

      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Retry GitHub Pages deployment
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        id: deployment_retry
