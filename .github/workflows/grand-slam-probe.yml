name: Grand Slam Wikipedia parser probe (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Check Grand Slam Wikipedia data (no file writes)
        run: python .github/grand-slam-probe/run.py
